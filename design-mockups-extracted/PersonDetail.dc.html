<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 9999px; --radius-pill: 100px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); }
    a { color: var(--color-link); text-decoration: none; }
    a:hover { filter: brightness(0.85); }
    .text-input { height:40px; padding:0 12px; border-radius:var(--radius-sm); border:1px solid var(--color-hairline); background:var(--color-canvas); color:var(--color-ink); font-family:var(--font-sans); font-size:14px; outline:none; width:100%; }
    .field-label { font-size:14px; font-weight:500; color:var(--color-ink); letter-spacing:-0.28px; display:block; margin-bottom:8px; }
  </style>
</helmet>

<div style="width:1280px; min-height:960px; display:flex; flex-direction:column; --color-primary:{{ colors.primary }}; --color-on-primary:{{ colors.onPrimary }}; --color-ink:{{ colors.ink }}; --color-body:{{ colors.body }}; --color-mute:{{ colors.mute }}; --color-hairline:{{ colors.hairline }}; --color-hairline-strong:{{ colors.hairlineStrong }}; --color-canvas:{{ colors.canvas }}; --color-canvas-soft:{{ colors.canvasSoft }}; --color-canvas-soft-2:{{ colors.canvasSoft2 }}; --color-link:{{ colors.link }}; --color-error-soft:{{ colors.errorSoft }}; --color-error-deep:{{ colors.errorDeep }}; --shadow-float:{{ colors.shadowFloat }}; background:var(--color-canvas-soft); color:var(--color-body);">

  <div style="height:64px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:var(--color-canvas); border-bottom:1px solid var(--color-hairline);">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="color:var(--color-ink)">
        <path d="M2 6V3a1 1 0 0 1 1-1h3M18 6V3a1 1 0 0 0-1-1h-3M2 14v3a1 1 0 0 0 1 1h3M18 14v3a1 1 0 0 1-1 1h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="font-size:14px; font-weight:600; color:var(--color-ink); letter-spacing:-0.28px;">FaceDB</span>
    </div>
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); color:var(--color-body);">Enroll</span>
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); background:var(--color-canvas-soft-2); color:var(--color-ink); font-weight:500;">People</span>
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); color:var(--color-body);">Search</span>
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); color:var(--color-body);">Compare</span>
    </div>
    <div style="width:76px;"></div>
  </div>

  <div style="flex:1 1 auto; padding:48px 64px; display:flex; flex-direction:column; gap:24px; max-width:960px;">

    <div style="display:flex; flex-direction:column; gap:4px;">
      <span style="font-size:12px; font-family:var(--font-mono); color:var(--color-mute);">People / {{ person.name }}</span>
      <h1 style="margin:0; font-size:32px; line-height:40px; font-weight:600; letter-spacing:-1.28px; color:var(--color-ink);">{{ person.name }}</h1>
    </div>

    <div style="display:flex; gap:32px; background:var(--color-canvas); border-radius:var(--radius-lg); padding:32px; box-shadow:var(--shadow-float);">

      <div style="display:flex; flex-direction:column; gap:16px; width:220px; flex:0 0 auto;">
        <div style="width:220px; height:220px; border-radius:var(--radius-md); background:var(--color-canvas-soft-2); display:flex; align-items:center; justify-content:center;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="color:var(--color-hairline-strong)">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>

        <sc-if value="{{ notConfirming }}" hint-placeholder-val="{{ true }}">
          <a href="#" style="height:36px; border-radius:var(--radius-pill); border:1px solid var(--color-error-soft); color:var(--color-error-deep); font-size:14px; font-weight:500; display:flex; align-items:center; justify-content:center;">Delete person</a>
        </sc-if>

        <sc-if value="{{ confirmingDelete }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; gap:8px; background:var(--color-error-soft); border-radius:var(--radius-md); padding:12px 16px;">
            <p style="margin:0; font-size:13px; color:var(--color-error-deep);">Delete {{ person.name }}? This can't be undone.</p>
            <div style="display:flex; gap:8px;">
              <a href="#" style="flex:1; height:32px; border-radius:var(--radius-pill); background:var(--color-canvas); color:var(--color-ink); font-size:13px; font-weight:500; display:flex; align-items:center; justify-content:center;">Cancel</a>
              <a href="#" style="flex:1; height:32px; border-radius:var(--radius-pill); background:var(--color-error-deep); color:var(--color-on-primary); font-size:13px; font-weight:500; display:flex; align-items:center; justify-content:center;">Confirm</a>
            </div>
          </div>
        </sc-if>
      </div>

      <div style="flex:1 1 auto; display:flex; flex-direction:column; gap:24px;">
        <div>
          <label class="field-label">Name</label>
          <input class="text-input" type="text" value="{{ person.name }}">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div>
            <label class="field-label">Gender</label>
            <select class="text-input">
              <option>Female</option>
            </select>
          </div>
          <div>
            <label class="field-label">Birthday</label>
            <input class="text-input" type="text" value="{{ person.birthday }}">
          </div>
          <div>
            <label class="field-label">Race</label>
            <select class="text-input">
              <option>Asian</option>
            </select>
          </div>
          <div>
            <label class="field-label">Profession</label>
            <input class="text-input" type="text" value="{{ person.profession }}">
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:8px;">
          <a href="#" style="height:44px; padding:0 24px; border-radius:var(--radius-pill); background:var(--color-primary); color:var(--color-on-primary); font-size:16px; font-weight:500; display:flex; align-items:center;">Save changes</a>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"confirmingDelete":{"editor":"boolean","default":false,"section":"State"},"darkMode":{"editor":"boolean","default":true,"section":"Theme"}}'>
const LIGHT = {
  primary: "#171717", onPrimary: "#ffffff", ink: "#171717", body: "#4d4d4d", mute: "#888888",
  hairline: "#ebebeb", hairlineStrong: "#a1a1a1", canvas: "#ffffff", canvasSoft: "#fafafa", canvasSoft2: "#f5f5f5",
  link: "#0070f3", errorSoft: "#f7d4d6", errorDeep: "#c50000",
  shadowFloat: "0px 2px 2px rgba(0,0,0,.04), 0px 8px 16px -4px rgba(0,0,0,.04), inset 0 0 0 1px rgba(0,0,0,.08)"
};
const DARK = {
  primary: "#f2f2f2", onPrimary: "#0a0a0a", ink: "#f2f2f2", body: "#a1a1a1", mute: "#6e6e6e",
  hairline: "#2a2a2a", hairlineStrong: "#454545", canvas: "#161616", canvasSoft: "#0a0a0a", canvasSoft2: "#1e1e1e",
  link: "#3b9eff", errorSoft: "rgba(255,84,112,0.16)", errorDeep: "#ff9caa",
  shadowFloat: "0px 2px 2px rgba(0,0,0,.5), 0px 8px 16px -4px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08)"
};
class Component extends DCLogic {
  renderVals() {
    const confirmingDelete = this.props.confirmingDelete ?? false;
    const darkMode = this.props.darkMode ?? false;
    const colors = darkMode ? DARK : LIGHT;
    return {
      confirmingDelete,
      notConfirming: !confirmingDelete,
      person: { name: "Maya Chen", profession: "Software Engineer", birthday: "1994-03-12" },
      colors
    };
  }
}
</script>
</body>
</html>
