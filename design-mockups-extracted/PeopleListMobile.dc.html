<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --radius-sm: 6px; --radius-full: 9999px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); }
  </style>
</helmet>

<div style="width:390px; min-height:844px; display:flex; flex-direction:column; --color-primary:{{ colors.primary }}; --color-on-primary:{{ colors.onPrimary }}; --color-ink:{{ colors.ink }}; --color-body:{{ colors.body }}; --color-mute:{{ colors.mute }}; --color-hairline:{{ colors.hairline }}; --color-hairline-strong:{{ colors.hairlineStrong }}; --color-canvas:{{ colors.canvas }}; --color-canvas-soft:{{ colors.canvasSoft }}; --color-canvas-soft-2:{{ colors.canvasSoft2 }}; --shadow-card:{{ colors.shadowCard }}; background:var(--color-canvas); color:var(--color-body);">

  <!-- Collapsed nav shell -->
  <div style="height:56px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:var(--color-canvas); border-bottom:1px solid var(--color-hairline);">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" style="color:var(--color-ink)">
        <path d="M2 6V3a1 1 0 0 1 1-1h3M18 6V3a1 1 0 0 0-1-1h-3M2 14v3a1 1 0 0 0 1 1h3M18 14v3a1 1 0 0 1-1 1h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="font-size:14px; font-weight:600; color:var(--color-ink); letter-spacing:-0.28px;">FaceDB</span>
    </div>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="color:var(--color-ink)">
      <path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div style="flex:1 1 auto; padding:24px 16px; display:flex; flex-direction:column; gap:20px; background:var(--color-canvas-soft);">

    <div style="display:flex; flex-direction:column; gap:4px;">
      <h1 style="margin:0; font-size:24px; line-height:32px; font-weight:600; letter-spacing:-0.96px; color:var(--color-ink);">People</h1>
      <p style="margin:0; font-size:14px; color:var(--color-body);">8 people enrolled</p>
    </div>

    <div style="position:relative;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="position:absolute; left:12px; top:12px; color:var(--color-mute);">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M14 14l-2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="Search by name…" style="width:100%; height:40px; padding:0 12px 0 36px; border-radius:var(--radius-sm); border:1px solid var(--color-hairline); background:var(--color-canvas); color:var(--color-ink); font-family:var(--font-sans); font-size:14px; outline:none;">
    </div>

    <div style="display:flex; flex-direction:column; background:var(--color-canvas); border-radius:8px; overflow:hidden; box-shadow:var(--shadow-card);">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
        <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--color-hairline);">
          <div style="width:44px; height:44px; flex:0 0 auto; border-radius:var(--radius-full); background:var(--color-canvas-soft-2); display:flex; align-items:center; justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="color:var(--color-hairline-strong)">
              <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div style="flex:1 1 auto; display:flex; flex-direction:column; gap:1px; min-width:0;">
            <span style="font-size:15px; font-weight:500; color:var(--color-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ p.name }}</span>
            <span style="font-size:13px; color:var(--color-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ p.profession }}</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:var(--color-hairline-strong); flex:0 0 auto;">
            <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"darkMode":{"editor":"boolean","default":true,"section":"Theme"}}'>
const LIGHT = {
  primary: "#171717", onPrimary: "#ffffff", ink: "#171717", body: "#4d4d4d", mute: "#888888",
  hairline: "#ebebeb", hairlineStrong: "#a1a1a1", canvas: "#ffffff", canvasSoft: "#fafafa", canvasSoft2: "#f5f5f5",
  shadowCard: "0px 1px 1px rgba(0,0,0,.02), 0px 2px 2px rgba(0,0,0,.04), inset 0 0 0 1px rgba(0,0,0,.08)"
};
const DARK = {
  primary: "#f2f2f2", onPrimary: "#0a0a0a", ink: "#f2f2f2", body: "#a1a1a1", mute: "#6e6e6e",
  hairline: "#2a2a2a", hairlineStrong: "#454545", canvas: "#161616", canvasSoft: "#0a0a0a", canvasSoft2: "#1e1e1e",
  shadowCard: "0px 1px 1px rgba(0,0,0,.5), 0px 2px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08)"
};
class Component extends DCLogic {
  renderVals() {
    const darkMode = this.props.darkMode ?? false;
    const colors = darkMode ? DARK : LIGHT;
    return {
      colors,
      people: [
        { name: "Maya Chen", profession: "Software Engineer" },
        { name: "Diego Alvarez", profession: "Photographer" },
        { name: "Amara Okafor", profession: "Product Designer" },
        { name: "Ravi Patel", profession: "Data Scientist" },
        { name: "Elena Novak", profession: "Architect" },
        { name: "Liam Walsh", profession: "Chef" },
        { name: "Sofia Rossi", profession: "Musician" },
        { name: "Kenji Sato", profession: "Illustrator" }
      ]
    };
  }
}
</script>
</body>
</html>
