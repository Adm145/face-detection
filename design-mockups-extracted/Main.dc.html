<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      --radius-sm: 6px; --radius-md: 8px; --radius-full: 9999px; --radius-pill: 100px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); }
    a { color: var(--color-link); text-decoration: none; }
    a:hover { filter: brightness(0.85); }
  </style>
</helmet>

<div style="width:1280px; min-height:960px; display:flex; flex-direction:column; --color-primary:{{ colors.primary }}; --color-on-primary:{{ colors.onPrimary }}; --color-ink:{{ colors.ink }}; --color-body:{{ colors.body }}; --color-mute:{{ colors.mute }}; --color-hairline:{{ colors.hairline }}; --color-hairline-strong:{{ colors.hairlineStrong }}; --color-canvas:{{ colors.canvas }}; --color-canvas-soft:{{ colors.canvasSoft }}; --color-canvas-soft-2:{{ colors.canvasSoft2 }}; --color-link:{{ colors.link }}; --shadow-card:{{ colors.shadowCard }}; background:var(--color-canvas-soft); color:var(--color-body);">

  <!-- Nav shell -->
  <div style="height:64px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:var(--color-canvas); border-bottom:1px solid var(--color-hairline);">
    <div style="display:flex; align-items:center; gap:8px;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" style="color:var(--color-ink)">
        <path d="M2 6V3a1 1 0 0 1 1-1h3M18 6V3a1 1 0 0 0-1-1h-3M2 14v3a1 1 0 0 0 1 1h3M18 14v3a1 1 0 0 1-1 1h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="font-size:14px; font-weight:600; color:var(--color-ink); letter-spacing:-0.28px;">FaceDB</span>
    </div>
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); color:var(--color-body);">Enroll</span>
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); background:var(--color-canvas-soft-2); color:var(--color-ink); font-weight:500;">People</span>
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); color:var(--color-body);">Search</span>
      <span style="font-size:14px; padding:6px 12px; border-radius:var(--radius-full); color:var(--color-body);">Compare</span>
    </div>
    <div style="width:76px;"></div>
  </div>

  <!-- Page body -->
  <div style="flex:1 1 auto; padding:48px 64px; display:flex; flex-direction:column; gap:32px;">

    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px;">
      <div style="display:flex; flex-direction:column; gap:8px;">
        <h1 style="margin:0; font-size:32px; line-height:40px; font-weight:600; letter-spacing:-1.28px; color:var(--color-ink);">People</h1>
        <p style="margin:0; font-size:16px; line-height:24px; color:var(--color-body);">{{ people.length }} people enrolled</p>
      </div>
      <div style="position:relative; width:320px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="position:absolute; left:12px; top:12px; color:var(--color-mute);">
          <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M14 14l-2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="text" placeholder="Search by name…" style="width:100%; height:40px; padding:0 12px 0 36px; border-radius:var(--radius-sm); border:1px solid var(--color-hairline); background:var(--color-canvas); color:var(--color-ink); font-family:var(--font-sans); font-size:14px; outline:none;">
      </div>
    </div>

    <sc-if value="{{ showEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; background:var(--color-canvas); border-radius:12px; box-shadow:var(--shadow-card); padding:96px 32px; margin-top:32px;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" style="color:var(--color-mute)">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h2 style="margin:0; font-size:20px; font-weight:600; color:var(--color-ink);">No people enrolled yet</h2>
        <p style="margin:0; font-size:14px; color:var(--color-mute); max-width:320px;">Enrolled faces will show up here once you add someone.</p>
        <a href="#" style="margin-top:8px; height:44px; padding:0 24px; border-radius:var(--radius-pill); background:var(--color-primary); color:var(--color-on-primary); font-size:16px; font-weight:500; display:inline-flex; align-items:center;">Enroll your first person</a>
      </div>
    </sc-if>

    <sc-if value="{{ notEmpty }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px;">
        <sc-for list="{{ people }}" as="p" hint-placeholder-count="8">
          <div style="display:flex; flex-direction:column; gap:12px; background:var(--color-canvas); border-radius:8px; box-shadow:var(--shadow-card); padding:16px;">
            <div style="width:100%; aspect-ratio:1; border-radius:6px; background:var(--color-canvas-soft-2); display:flex; align-items:center; justify-content:center;">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="color:var(--color-hairline-strong)">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div style="display:flex; flex-direction:column; gap:2px;">
              <span style="font-size:16px; font-weight:500; color:var(--color-ink);">{{ p.name }}</span>
              <span style="font-size:14px; color:var(--color-body);">{{ p.profession }}</span>
              <span style="font-size:12px; color:var(--color-mute); margin-top:4px;">{{ p.meta }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"showEmpty":{"editor":"boolean","default":false,"section":"State"},"darkMode":{"editor":"boolean","default":true,"section":"Theme"}}'>
const LIGHT = {
  primary: "#171717", onPrimary: "#ffffff", ink: "#171717", body: "#4d4d4d", mute: "#888888",
  hairline: "#ebebeb", hairlineStrong: "#a1a1a1", canvas: "#ffffff", canvasSoft: "#fafafa", canvasSoft2: "#f5f5f5",
  link: "#0070f3",
  shadowCard: "0px 1px 1px rgba(0,0,0,.02), 0px 2px 2px rgba(0,0,0,.04), inset 0 0 0 1px rgba(0,0,0,.08)"
};
const DARK = {
  primary: "#f2f2f2", onPrimary: "#0a0a0a", ink: "#f2f2f2", body: "#a1a1a1", mute: "#6e6e6e",
  hairline: "#2a2a2a", hairlineStrong: "#454545", canvas: "#161616", canvasSoft: "#0a0a0a", canvasSoft2: "#1e1e1e",
  link: "#3b9eff",
  shadowCard: "0px 1px 1px rgba(0,0,0,.5), 0px 2px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08)"
};
class Component extends DCLogic {
  renderVals() {
    const showEmpty = this.props.showEmpty ?? false;
    const darkMode = this.props.darkMode ?? false;
    const colors = darkMode ? DARK : LIGHT;
    const people = [
      { name: "Maya Chen", profession: "Software Engineer", meta: "Female · Asian · 1994" },
      { name: "Diego Alvarez", profession: "Photographer", meta: "Male · White · 1989" },
      { name: "Amara Okafor", profession: "Product Designer", meta: "Female · Black · 1997" },
      { name: "Ravi Patel", profession: "Data Scientist", meta: "Male · Indian · 1992" },
      { name: "Elena Novak", profession: "Architect", meta: "Female · White · 1985" },
      { name: "Liam Walsh", profession: "Chef", meta: "Male · White · 1990" },
      { name: "Sofia Rossi", profession: "Musician", meta: "Female · White · 1996" },
      { name: "Kenji Sato", profession: "Illustrator", meta: "Male · Asian · 1993" }
    ];
    return { showEmpty, notEmpty: !showEmpty, people: showEmpty ? [] : people, colors };
  }
}
</script>
</body>
</html>
